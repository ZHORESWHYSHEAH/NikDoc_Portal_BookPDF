<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if show_change_password %}Reset Password{% else %}Admin Login{% endif %} - NikDoc Portal</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>NIKDOC PORTAL</h2>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">Secure Administration</p>
            </div>
            
            {% if error %}
                <div style="background: rgba(248,113,113,0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 14px;">
                    <i class="fa-solid fa-triangle-exclamation" style="margin-right: 6px;"></i> {{ error }}
                </div>
            {% endif %}

            {% if success_message %}
                <div style="background: rgba(52,211,153,0.15); border: 1px solid var(--success); color: var(--success); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 14px;">
                    <i class="fa-solid fa-circle-info" style="margin-right: 6px;"></i> {{ success_message }}
                </div>
            {% endif %}

            {% if show_change_password %}
                <!-- Password Change Form -->
                <form action="" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="form-group" style="text-align: left;">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" class="form-input" required placeholder="Min 5 characters" autofocus>
                    </div>

                    <div class="form-group" style="text-align: left;">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" required placeholder="Re-enter password">
                    </div>

                    <button type="submit" class="btn-premium" style="width: 100%; margin-top: 10px;">
                        Update Password & Login <i class="fa-solid fa-key"></i>
                    </button>
                </form>
            {% else %}
                <!-- Standard Login Form -->
                <form action="" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="form-group" style="text-align: left;">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-input" required placeholder="Enter username" autofocus>
                    </div>

                    <div class="form-group" style="text-align: left;">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-input" required placeholder="Enter password">
                    </div>

                    <button type="submit" class="btn-premium" style="width: 100%; margin-top: 10px;">
                        Secure Authorization <i class="fa-solid fa-lock"></i>
                    </button>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
